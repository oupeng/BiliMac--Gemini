name: Build macOS App (Intel x86_64)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Intel x86_64 Binary
        run: |
          # 仅针对 Intel x86_64 架构编译，极速构建
          swift build -c release --arch x86_64

      - name: Package Intel .app Bundle
        run: |
          mkdir -p BiliMac.app/Contents/MacOS
          mkdir -p BiliMac.app/Contents/Resources
          
          # 自动检索生成的 x86_64 可执行文件
          TARGET_BIN=$(find .build -type f -name "BiliMac" -perm +111 ! -name "*.dSYM*" ! -path "*/Intermediates*/*" | head -n 1)
          cp "$TARGET_BIN" BiliMac.app/Contents/MacOS/BiliMac
          
          cp Info.plist BiliMac.app/Contents/Info.plist
          
          # 针对本地环境自签名
          codesign --force --deep --sign - BiliMac.app
          zip -r -y BiliMac-Intel.zip BiliMac.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliMac-Intel
          path: BiliMac-Intel.zip
